<!-- templates/registration/login.html -->
{% extends 'base.html' %}

{% block content %}

<div class="col-md-6 offset-md-3">
    <h1>Login</h1>
    <br/>
    <div class="mb-3">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
    </div>
</div>



{% endblock %}
