<h1>All Ingredients</h1>

<form method="get" action=".">
  <input type="text" name="q" placeholder="Search ingredients..." value="{{ query|default_if_none:'' }}">
  <button type="submit">Search</button>
</form>

<table border="1" cellspacing="0" cellpadding="8">
  <thead>
    <tr>
      <th>Name</th>
      <th>Calories</th>
      <th>Substitutions</th>
      <th>Restricted</th>
      <!-- Add more columns if your Ingredient model has them -->
    </tr>
  </thead>
  <tbody>
    {% for ingredient in ingredients %}
      <tr>
        <td>{{ ingredient.name }}</td>
        <td>{{ ingredient.calories }}</td>
        <td>{{ ingredient.substitutes.name }}</td>
        <td>
          <button class="restrict-btn"
          data-name="{{ ingredient.name }}">
          {% if ingredient.name in restricted_ingredients %}
              Unrestrict
          {% else %}
              Restrict
          {% endif %}
          </button>
        <!-- Add more cells if needed -->
      </tr>
    {% empty %}
      <tr>
        <td colspan="3">No ingredients found.</td>
      </tr>
    {% endfor %}
  </tbody>
</table>

<script>
  document.querySelectorAll('.restrict-btn').forEach(function(button) {
      button.addEventListener('click', function() {
          const ingredientName = this.dataset.name;
          const btn = this;
  
          fetch("{% url 'toggle_restricted_ingredient' %}", {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': '{{ csrf_token }}'
              },
              body: JSON.stringify({ 'ingredient_name': ingredientName })
          }).then(response => response.json())
            .then(data => {
                if (data.status === 'restricted') {
                    btn.textContent = 'Unrestrict';
                } else if (data.status === 'unrestricted') {
                    btn.textContent = 'Restrict';
                }
            });
      });
  });
  </script>
