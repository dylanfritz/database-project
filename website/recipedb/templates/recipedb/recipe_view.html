<!--recipe_view.html-->
<!--This just lists out the titles of all the recipes in the database. Make look nice maybe later idk -->
{% extends 'base.html' %}

{% block content %}
  <h1>All Recipes</h1>
  <ul class="list-group">
    {% for recipe in recipes %}
      <li class="list-group-item"><a href="{% url 'recipe_page' recipe.id %}">{{ recipe.name }}</a></li>
    {% empty %}
      <li class="list-group-item">No recipes available.</li>
    {% endfor %}
  </ul>
{% endblock %}
